<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DAT2 Verbale"><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png"><title>DAT2 Verbale</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;margin:0;background:#f4f5f7;color:#111827}
.wrap{max-width:780px;margin:auto;padding:16px 16px 100px}.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 2px 12px #0001}
input[type=text]{width:100%;padding:14px;border:1px solid #d0d5dd;border-radius:12px;font-size:17px}.opt{display:block;border:1px solid #d0d5dd;border-radius:12px;padding:12px;margin:9px 0}
button{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:16px;margin:5px;background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}
.hidden{display:none}.bad{border-left:5px solid #b42318}.good{border-left:5px solid #027a48}.muted{color:#667085}.error{color:#b42318;font-weight:700}
.sticky{position:fixed;bottom:0;left:0;right:0;background:#fffffff0;backdrop-filter:blur(10px);padding:10px;text-align:center;border-top:1px solid #ddd}
.progress{height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:10px}.progress div{height:100%;background:#111827}
@media print{button,.sticky{display:none!important}.card{box-shadow:none;border:1px solid #ddd}body{background:white}}
</style></head><body><div class="wrap">
<div class="card"><h1>DAT2 Verbale</h1><div class="muted">Test 40 domande · accesso personale</div><div class="progress"><div id="bar" style="width:0"></div></div></div>

<div id="gate" class="card">
<h2>Accesso riservato</h2>
<label><b>Codice personale</b></label><input id="accessCode" type="text" placeholder="Es. DAT2-001" autocapitalize="characters">
<p class="muted">Il codice può essere utilizzato da un solo dispositivo e per massimo 5 accessi.</p>
<button style="width:100%" onclick="authorize()">ENTRA</button><p id="gateMsg" class="error"></p>
</div>

<div id="start" class="card hidden"><h2>Inizia il test</h2><label><b>Nome e Cognome</b></label>
<input id="candidate" type="text" autocomplete="name" placeholder="Inserisci nome e cognome">
<button style="width:100%;margin-top:14px" onclick="startTest()">Inizia</button>
</div><div id="quiz" class="hidden"></div><div id="result" class="hidden"></div></div>
<div id="nav" class="sticky hidden"><button class="secondary" id="back" onclick="prevPage()">Indietro</button><button id="next" onclick="nextPage()">Avanti</button></div>
<script>
const SUPABASE_API_URL="https://cgeclvvnjfkwxllfkbsc.supabase.co/rest/v1/";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_a6A7tt1O5_W6VCUvqubxGw_ka2jPvN3";
const Q=[{"q": "… sta a falso come genuino sta a …", "opts": ["contraffatto - autentico", "reale - vero", "mascherato - reale", "autentico - sincero", "ingannevole - contraffatto"], "correct": 0}, {"q": "… sta a spesso come raramente sta a …", "opts": ["di rado - difficilmente", "sempre - talvolta", "frequentemente - di rado", "frequentemente - sempre", "occasionalmente - mai"], "correct": 2}, {"q": "… sta a aguzzo come caro sta a …", "opts": ["smussato - costoso", "smussato - diletto", "spuntato - economico", "tondeggiante - bello", "acuto - economico"], "correct": 2}, {"q": "… sta a ruscello come profondo sta a …", "opts": ["basso - oceano", "acqua - pozzo", "sinuoso - pozzo", "torrente - oceano", "basso - senza fondo"], "correct": 0}, {"q": "… sta a trottola come rotolamento sta a …", "opts": ["rotazione - cerchio", "giro - rotazione", "rotazione - palla", "birillo - cerchio", "giocattolo - palla"], "correct": 2}, {"q": "… sta a mago come barzelletta sta a …", "opts": ["incantesimo - battuta", "trucco - umorismo", "stregone - comico", "incantesimo - risata", "trucco - comico"], "correct": 4}, {"q": "… sta a contratto come stretta di mano sta a …", "opts": ["firma - gesto", "affari - saluto", "firma - accordo", "affari - gesto", "trattato - amicizia"], "correct": 2}, {"q": "… sta a quattro come duetto sta a …", "opts": ["quartetto - canzone", "quartetto - due", "quattro - due", "due - uno", "numero - canzone"], "correct": 2}, {"q": "… sta a sonno come svegliarsi sta a …", "opts": ["sognare - veglia", "addormentarsi - veglia", "sonnecchiare - pisolino", "sognare - dormita", "veglia - alzarsi"], "correct": 1}, {"q": "… sta a restringere come avanti sta a …", "opts": ["ritirare - indietro", "respingere - rovescio", "esteso - avanzamento", "estendere - indietro", "espandere - avanzamento"], "correct": 3}, {"q": "… sta a festa come citare sta a …", "opts": ["invitare - tribunale", "intervenire - ordine", "radunare - giudice", "intervenire - biglietto", "celebrare - processo"], "correct": 0}, {"q": "… sta a morso come vespa sta a …", "opts": ["serpente - nido", "ragno - puntura", "cane - insetto", "latrato - puntura", "ragno - insetto"], "correct": 1}, {"q": "… sta a strada come galleria sta a …", "opts": ["vicolo - via", "automobile - passaggio", "angolo - canale", "marciapiede - casa", "viale - corridoio"], "correct": 4}, {"q": "… sta a albero come gemma sta a …", "opts": ["seme - rosa", "virgulto - fiore", "acero - petalo", "seme - petalo", "foresta - mazzo"], "correct": 1}, {"q": "… sta a domandare come replicare sta a …", "opts": ["rispondere - ribattere", "contestare - chiedere", "interrogare - chiedere", "chiedere - rispondere", "indagare - sfidare"], "correct": 3}, {"q": "… sta a vangare come coltello sta a …", "opts": ["fosso - affettare", "pala - salame", "fosso - inforcare", "pala - affettare", "sterrato - lama"], "correct": 3}, {"q": "… sta a scrivere come borbottare sta a …", "opts": ["leggere - ascoltare", "stampare - bisbigliare", "stampare - sentire", "scarabocchiare - ascoltare", "scarabocchiare - parlare"], "correct": 4}, {"q": "… sta a tardi come primo sta a …", "opts": ["presto - secondo", "ultimo - secondo", "lento - veloce", "presto - ultimo", "tardo - ultimo"], "correct": 3}, {"q": "… sta a mano come calzino sta a …", "opts": ["guanto - scarpa", "guanto - piede", "anello - alluce", "pollice - piede", "pugno - cazzotto"], "correct": 1}, {"q": "… sta a sottile come abbondante sta a …", "opts": ["grosso - copioso", "magro - scarso", "dieta - banchetto", "grasso - magro", "spesso - scarso"], "correct": null}, {"q": "… sta a fatica come bere sta a …", "opts": ["riposare - sete", "riposare - acqua", "sforzarsi - acqua", "dormire - cibo", "stancarsi - sete"], "correct": 0}, {"q": "… sta a ordinario come speciale sta a …", "opts": ["medio - generale", "comune - insolito", "inusuale - scadente", "insolito - raro", "originale - peculiare"], "correct": 1}, {"q": "… sta a manufatto come fattoria sta a …", "opts": ["fabbrica - agricoltura", "fabbricazione - coltivazione", "manovale - raccolto", "agricoltura - impianto", "fabbrica - raccolto"], "correct": 4}, {"q": "… sta a accompagnare come disertare sta a …", "opts": ["abbandonare - isolare", "scortare - salvare", "separare - isolare", "associare - abbandonare", "scortare - associare"], "correct": null}, {"q": "… sta a pausa come punto sta a …", "opts": ["momento - tempo", "conversazione - tempo", "virgola - fine", "intervallo - fine", "conversazione - frase"], "correct": 2}, {"q": "… sta a scuola come medico sta a …", "opts": ["istruzione - medicina", "studente - dottore", "lezione - malattia", "istruzione - ospedale", "insegnante - ospedale"], "correct": 4}, {"q": "… sta a flotta come carro sta a …", "opts": ["naviglio - conducente", "comandante - pista", "nave - carovana", "comandante - conducente", "nave - veicolo"], "correct": 2}, {"q": "… sta a freddo come tiepido sta a …", "opts": ["ghiaccio - fuoco", "caldo - fresco", "ghiacciato - calore", "ghiaccio - rovente", "temperato - mite"], "correct": 1}, {"q": "… sta a aeroplano come macchinista sta a …", "opts": ["jet - treno", "pilota - capotreno", "pilota - treno", "aeroporto - ferrovia", "cielo - ferrovia"], "correct": 2}, {"q": "… sta a aggraziato come contorto sta a …", "opts": ["simpatico - curvo", "maldestro - piegato", "goffo - dritto", "maldestro - confuso", "bello - dritto"], "correct": 2}, {"q": "… sta a elezione come aspirante sta a …", "opts": ["voto - gara", "elettore - candidato", "campagna elettorale - titolo", "candidato - titolo", "elettore - sport"], "correct": 3}, {"q": "… sta a noce come buccia sta a …", "opts": ["gheriglio - scorza", "guscio - arancia", "verdura - frutta", "guscio - scorza", "mallo - pelle"], "correct": 1}, {"q": "… sta a maglione come intrecciare sta a …", "opts": ["tessere - telaio", "tessere - canestro", "giacca - coperta", "lana - filo", "giacca - telaio"], "correct": 1}, {"q": "… sta a povertà come sovrappiù sta a …", "opts": ["soldi - spreco", "ricchezza - eccesso", "indigenza - carenza", "risparmio - spreco", "ricchezza - carenza"], "correct": 4}, {"q": "… sta a risolvere come trama sta a …", "opts": ["problema - macchinare", "rompicapo - intrigare", "risposta - delineare", "mistero - districare", "rompicapo - storia"], "correct": 3}, {"q": "… sta a pettirosso come pelo sta a …", "opts": ["uccello - animale", "nido - pelle", "penna - pelliccia", "penna - volpe", "ala - pelle"], "correct": 3}, {"q": "… sta a comprare come scegliere sta a …", "opts": ["vendere - selezionare", "commerciare - prendere", "acquistare - selezionare", "negoziare - preferire", "vendere - rubare"], "correct": 2}, {"q": "… sta a tinta come legno sta a …", "opts": ["stoffa - legname", "sfumatura - catasta", "vernice - ascia", "tessuto - vernice", "colore - pittura"], "correct": 2}, {"q": "… sta a paragrafo come lettera sta a …", "opts": ["frase - messaggio", "proposizione - francobollo", "capitolo - alfabeto", "capoverso - messaggio", "frase - parola"], "correct": 4}, {"q": "… sta a agitare come occhi sta a …", "opts": ["mani - sbattere", "capelli - strizzare", "mareggiata - tempesta", "mare - strizzatina", "bandiera - vedere"], "correct": 0}]; const PAGE=5;
let answers=Array(Q.length).fill(null),page=0,candidate="",activeCode="";
function deviceId(){let id=localStorage.getItem('dat2_device_id');if(!id){id=(crypto.randomUUID?crypto.randomUUID():'d-'+Date.now()+'-'+Math.random().toString(36).slice(2));localStorage.setItem('dat2_device_id',id)}return id}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function authorize(){
 const code=document.getElementById('accessCode').value.trim().toUpperCase();
 const msg=document.getElementById('gateMsg');
 msg.textContent='';
 if(!code){msg.textContent='Inserisci il codice personale.';return}
 try{
   const r=await fetch(SUPABASE_API_URL+'rpc/dat2_autorizza',{
     method:'POST',
     headers:{
       'Content-Type':'application/json',
       'apikey':SUPABASE_PUBLISHABLE_KEY
     },
     body:JSON.stringify({
       p_codice:code,
       p_device_id:deviceId()
     })
   });
   if(!r.ok){
     const t=await r.text();
     console.error(t);
     msg.textContent='Errore di collegamento a Supabase.';
     return;
   }
   const x=await r.json();
   if(!x.ok){
     msg.textContent=x.message||'Accesso non autorizzato.';
     return;
   }
   activeCode=code;
   document.getElementById('gate').classList.add('hidden');
   document.getElementById('start').classList.remove('hidden');
   msg.textContent='';
   alert('Accesso '+x.accessi_usati+' di '+x.max_accessi);
 }catch(e){
   console.error(e);
   msg.textContent='Errore di collegamento. Riprova.';
 }
}
function startTest(){candidate=document.getElementById('candidate').value.trim();if(!candidate){alert('Inserisci Nome e Cognome.');return}
 document.getElementById('start').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');document.getElementById('nav').classList.remove('hidden');render()}
function render(){const s=page*PAGE,e=Math.min(s+PAGE,Q.length);let h='';
 for(let i=s;i<e;i++){const x=Q[i];h+=`<div class="card"><h3>${i+1}. ${esc(x.q)}</h3>`;
 x.opts.forEach((o,j)=>h+=`<label class="opt"><input type="radio" name="q${i}" ${answers[i]===j?'checked':''} onchange="answers[${i}]=${j}">${j+1}. ${esc(o)}</label>`);h+='</div>'}
 document.getElementById('quiz').innerHTML=h;document.getElementById('bar').style.width=(e/Q.length*100)+'%';document.getElementById('back').disabled=page===0;document.getElementById('next').textContent=e===Q.length?'Termina':'Avanti';window.scrollTo(0,0)}
function prevPage(){if(page>0){page--;render()}}
function nextPage(){const s=page*PAGE,e=Math.min(s+PAGE,Q.length),miss=[];for(let i=s;i<e;i++)if(answers[i]===null)miss.push(i+1);if(miss.length){alert('Rispondi prima alle domande: '+miss.join(', '));return}if(e===Q.length){finish();return}page++;render()}
function isCorrect(i){return Q[i].correct===null||answers[i]===Q[i].correct}
function wrong(){return Q.map((_,i)=>i).filter(i=>!isCorrect(i))}
function finish(){document.getElementById('nav').classList.add('hidden');document.getElementById('quiz').classList.add('hidden');const w=wrong(),ok=40-w.length,p=(ok/40*100).toFixed(1);
 const r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML=`<div class="card"><h2>Risultato</h2><p><b>${esc(candidate)}</b></p><p style="font-size:28px"><b>${ok}/40</b></p><p>Corrette: ${ok} · Errate: ${w.length} · ${p}%</p><button onclick="showErrors()">Visualizza errori</button><button onclick="printReport()">Stampa / Salva PDF</button></div><div id="errors"></div>`;window.scrollTo(0,0)}
function showErrors(){const w=wrong(),box=document.getElementById('errors');if(!w.length){box.innerHTML='<div class="card good"><b>Nessun errore.</b></div>';return}
 box.innerHTML=w.map(i=>{const x=Q[i],a=answers[i];return `<div class="card bad"><h3>Domanda ${i+1}</h3><p>${esc(x.q)}</p><p><b>Risposta data:</b> ${a+1}. ${esc(x.opts[a])}</p><p><b>Risposta corretta:</b> ${x.correct===null?'Qualsiasi risposta da 1 a 5':(x.correct+1)+'. '+esc(x.opts[x.correct])}</p></div>`}).join('')}
function printReport(){showErrors();setTimeout(()=>window.print(),200)}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script></body></html>

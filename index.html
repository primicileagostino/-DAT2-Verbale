<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<title>DAT2 Verbale</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;margin:0;background:#f4f5f7;color:#111827}.wrap{max-width:760px;margin:auto;padding:18px}
.card{background:white;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 2px 12px #0001}h1{margin:5px 0 8px}.muted{color:#667085}
.opt{display:block;border:1px solid #ddd;border-radius:12px;padding:12px;margin:9px 0}.opt input{margin-right:9px}
button{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:16px;margin:5px;background:#111827;color:white}.secondary{background:#e5e7eb;color:#111827}
.bad{border-left:5px solid #b42318}.good{border-left:5px solid #027a48}.hidden{display:none}@media print{button{display:none}.card{box-shadow:none}}
</style></head><body><div class="wrap"><div class="card"><h1>DAT2 Verbale</h1><div class="muted">Test di 40 domande</div></div>
<div id="quiz"></div><div class="card"><button onclick="finish()">Termina test</button></div>
<div id="result" class="hidden"></div></div>
<script>const Q=[{"q": "… sta a falso come genuino sta a …", "opts": ["contraffatto - autentico", "reale - vero", "mascherato - reale", "autentico - sincero", "ingannevole - contraffatto"], "correct": 0}, {"q": "… sta a spesso come raramente sta a …", "opts": ["di rado - difficilmente", "sempre - talvolta", "frequentemente - di rado", "frequentemente - sempre", "occasionalmente - mai"], "correct": 2}, {"q": "… sta a aguzzo come caro sta a …", "opts": ["smussato - costoso", "smussato - diletto", "spuntato - economico", "tondeggiante - bello", "acuto - economico"], "correct": 2}, {"q": "… sta a ruscello come profondo sta a …", "opts": ["basso - oceano", "acqua - pozzo", "sinuoso - pozzo", "torrente - oceano", "basso - senza fondo"], "correct": 0}, {"q": "… sta a trottola come rotolamento sta a …", "opts": ["rotazione - cerchio", "giro - rotazione", "rotazione - palla", "birillo - cerchio", "giocattolo - palla"], "correct": 2}, {"q": "… sta a mago come barzelletta sta a …", "opts": ["incantesimo - battuta", "trucco - umorismo", "stregone - comico", "incantesimo - risata", "trucco - comico"], "correct": 4}, {"q": "… sta a contratto come stretta di mano sta a …", "opts": ["firma - gesto", "affari - saluto", "firma - accordo", "affari - gesto", "trattato - amicizia"], "correct": 2}, {"q": "… sta a quattro come duetto sta a …", "opts": ["quartetto - canzone", "quartetto - due", "quattro - due", "due - uno", "numero - canzone"], "correct": 2}, {"q": "… sta a sonno come svegliarsi sta a …", "opts": ["sognare - veglia", "addormentarsi - veglia", "sonnecchiare - pisolino", "sognare - dormita", "veglia - alzarsi"], "correct": 1}, {"q": "… sta a restringere come avanti sta a …", "opts": ["ritirare - indietro", "respingere - rovescio", "esteso - avanzamento", "estendere - indietro", "espandere - avanzamento"], "correct": 3}, {"q": "… sta a festa come citare sta a …", "opts": ["invitare - tribunale", "intervenire - ordine", "radunare - giudice", "intervenire - biglietto", "celebrare - processo"], "correct": 0}, {"q": "… sta a morso come vespa sta a …", "opts": ["serpente - nido", "ragno - puntura", "cane - insetto", "latrato - puntura", "ragno - insetto"], "correct": 1}, {"q": "… sta a strada come galleria sta a …", "opts": ["vicolo - via", "automobile - passaggio", "angolo - canale", "marciapiede - casa", "viale - corridoio"], "correct": 4}, {"q": "… sta a albero come gemma sta a …", "opts": ["seme - rosa", "virgulto - fiore", "acero - petalo", "seme - petalo", "foresta - mazzo"], "correct": 1}, {"q": "… sta a domandare come replicare sta a …", "opts": ["rispondere - ribattere", "contestare - chiedere", "interrogare - chiedere", "chiedere - rispondere", "indagare - sfidare"], "correct": 3}, {"q": "… sta a vangare come coltello sta a …", "opts": ["fosso - affettare", "pala - salame", "fosso - inforcare", "pala - affettare", "sterrato - lama"], "correct": 3}, {"q": "… sta a scrivere come borbottare sta a …", "opts": ["leggere - ascoltare", "stampare - bisbigliare", "stampare - sentire", "scarabocchiare - ascoltare", "scarabocchiare - parlare"], "correct": 4}, {"q": "… sta a tardi come primo sta a …", "opts": ["presto - secondo", "ultimo - secondo", "lento - veloce", "presto - ultimo", "tardo - ultimo"], "correct": 3}, {"q": "… sta a mano come calzino sta a …", "opts": ["guanto - scarpa", "guanto - piede", "anello - alluce", "pollice - piede", "pugno - cazzotto"], "correct": 1}, {"q": "… sta a sottile come abbondante sta a …", "opts": ["grosso - copioso", "magro - scarso", "dieta - banchetto", "grasso - magro", "spesso - scarso"], "correct": null}, {"q": "… sta a fatica come bere sta a …", "opts": ["riposare - sete", "riposare - acqua", "sforzarsi - acqua", "dormire - cibo", "stancarsi - sete"], "correct": 0}, {"q": "… sta a ordinario come speciale sta a …", "opts": ["medio - generale", "comune - insolito", "inusuale - scadente", "insolito - raro", "originale - peculiare"], "correct": 1}, {"q": "… sta a manufatto come fattoria sta a …", "opts": ["fabbrica - agricoltura", "fabbricazione - coltivazione", "manovale - raccolto", "agricoltura - impianto", "fabbrica - raccolto"], "correct": 4}, {"q": "… sta a accompagnare come disertare sta a …", "opts": ["abbandonare - isolare", "scortare - salvare", "separare - isolare", "associare - abbandonare", "scortare - associare"], "correct": null}, {"q": "… sta a pausa come punto sta a …", "opts": ["momento - tempo", "conversazione - tempo", "virgola - fine", "intervallo - fine", "conversazione - frase"], "correct": 2}, {"q": "… sta a scuola come medico sta a …", "opts": ["istruzione - medicina", "studente - dottore", "lezione - malattia", "istruzione - ospedale", "insegnante - ospedale"], "correct": 4}, {"q": "… sta a flotta come carro sta a …", "opts": ["naviglio - conducente", "comandante - pista", "nave - carovana", "comandante - conducente", "nave - veicolo"], "correct": 2}, {"q": "… sta a freddo come tiepido sta a …", "opts": ["ghiaccio - fuoco", "caldo - fresco", "ghiacciato - calore", "ghiaccio - rovente", "temperato - mite"], "correct": 1}, {"q": "… sta a aeroplano come macchinista sta a …", "opts": ["jet - treno", "pilota - capotreno", "pilota - treno", "aeroporto - ferrovia", "cielo - ferrovia"], "correct": 2}, {"q": "… sta a aggraziato come contorto sta a …", "opts": ["simpatico - curvo", "maldestro - piegato", "goffo - dritto", "maldestro - confuso", "bello - dritto"], "correct": 2}, {"q": "… sta a elezione come aspirante sta a …", "opts": ["voto - gara", "elettore - candidato", "campagna elettorale - titolo", "candidato - titolo", "elettore - sport"], "correct": 3}, {"q": "… sta a noce come buccia sta a …", "opts": ["gheriglio - scorza", "guscio - arancia", "verdura - frutta", "guscio - scorza", "mallo - pelle"], "correct": 1}, {"q": "… sta a maglione come intrecciare sta a …", "opts": ["tessere - telaio", "tessere - canestro", "giacca - coperta", "lana - filo", "giacca - telaio"], "correct": 1}, {"q": "… sta a povertà come sovrappiù sta a …", "opts": ["soldi - spreco", "ricchezza - eccesso", "indigenza - carenza", "risparmio - spreco", "ricchezza - carenza"], "correct": 4}, {"q": "… sta a risolvere come trama sta a …", "opts": ["problema - macchinare", "rompicapo - intrigare", "risposta - delineare", "mistero - districare", "rompicapo - storia"], "correct": 3}, {"q": "… sta a pettirosso come pelo sta a …", "opts": ["uccello - animale", "nido - pelle", "penna - pelliccia", "penna - volpe", "ala - pelle"], "correct": 3}, {"q": "… sta a comprare come scegliere sta a …", "opts": ["vendere - selezionare", "commerciare - prendere", "acquistare - selezionare", "negoziare - preferire", "vendere - rubare"], "correct": 2}, {"q": "… sta a tinta come legno sta a …", "opts": ["stoffa - legname", "sfumatura - catasta", "vernice - ascia", "tessuto - vernice", "colore - pittura"], "correct": 2}, {"q": "… sta a paragrafo come lettera sta a …", "opts": ["frase - messaggio", "proposizione - francobollo", "capitolo - alfabeto", "capoverso - messaggio", "frase - parola"], "correct": 4}, {"q": "… sta a agitare come occhi sta a …", "opts": ["mani - sbattere", "capelli - strizzare", "mareggiata - tempesta", "mare - strizzatina", "bandiera - vedere"], "correct": 0}];let answers={};
function render(){let h='';Q.forEach((x,i)=>{h+=`<div class="card"><b>${i+1}. ${x.q}</b>`;x.opts.forEach((o,j)=>h+=`<label class="opt"><input type="radio" name="q${i}" value="${j}" onchange="answers[${i}]=${j}">${j+1}. ${o}</label>`);h+='</div>'});document.getElementById('quiz').innerHTML=h}
function isCorrect(i){return Q[i].correct===null || answers[i]===Q[i].correct}
function finish(){let wrong=[];Q.forEach((x,i)=>{if(!isCorrect(i))wrong.push(i)});let ok=Q.length-wrong.length;
let h=`<div class="card"><h2>Risultato</h2><p><b>Corrette: ${ok}/40</b></p><button onclick="showErrors()">Visualizza errori</button><button onclick="pdf()">Report PDF</button></div><div id="errors"></div>`;
document.getElementById('result').innerHTML=h;document.getElementById('result').classList.remove('hidden');window._wrong=wrong;document.getElementById('result').scrollIntoView()}
function showErrors(){let e=document.getElementById('errors');if(!window._wrong.length){e.innerHTML='<div class="card good"><b>Nessun errore.</b></div>';return}
e.innerHTML=window._wrong.map(i=>{let x=Q[i],a=answers[i];return `<div class="card bad"><b>Domanda ${i+1}</b><p>${x.q}</p><p>Tua risposta: ${a===undefined?'Non risposta':(a+1)+'. '+x.opts[a]}</p><p>Risposta corretta: ${x.correct===null?'Qualsiasi risposta':(x.correct+1)+'. '+x.opts[x.correct]}</p></div>`}).join('')}
function pdf(){showErrors();setTimeout(()=>window.print(),150)}
render();</script></body></html>
